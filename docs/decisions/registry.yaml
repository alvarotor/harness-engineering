# Decision & preference registry: CURRENT project memory (ADR-0001). Read this at session start.
# Superseded entries, resolved questions and the changelog live in history.yaml (not read at session start;
# the harness merges both files, R-REG-006).
# - status: proposed | accepted | superseded | deprecated
# - source: user (stated/approved by owner) | default (agent proposal, not contested)
# - enforced_by: files that enforce the entry TODAY (validated by R-REG-004)
# - planned_enforced_by: enforcement that arrives with later changes (not validated)
# Change accepted entries only through an OpenSpec change (see CONTRIBUTING.md).

