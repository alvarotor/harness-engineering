preferences:
  - id: P-0002
    statement: Start simple and reversible. Introduce gateway, durable broker, mesh, Kubernetes or cache only on the triggers in ARCHITECTURE.md §13.
    source: user
  - id: P-0003
    statement: Never silently make expensive, security-sensitive or hard-to-reverse decisions. Ask the owner.
    source: user
  - id: P-0004
    statement: Never claim validation passed unless it was executed.
    source: user
  - id: P-0005
    statement: Current stage defines the way of working (harness) and a first basic architecture. No product features yet.
    source: user
  - id: P-0006
    statement: Language/framework choices are defaults; a specific library choice may justify an override, recorded as an exception.
    source: user
  - id: P-0007
    statement: Agents may install developer tools locally (user space) only after explicit owner approval. If an install needs privileges (sudo), give the owner the exact commands instead.
    source: user
  - id: P-0008
    statement: "Agent roles are: orchestrator (sequences work, never edits), architect, planner (also archives), implementer, test-engineer, security-reviewer (only for security-sensitive changes), reviewer, documentation, devops."
    source: user
  - id: P-0010
    statement: Every role documents its own work in the same step, following the documentation map in docs/agents/README.md. The documentation role only verifies this against the change and fixes descriptive gaps, reporting who missed them.
    source: user
  - id: P-0012
    statement: Supported developer environments are macOS, Linux and Termux for GNU Make and repository commands whose host dependencies are available. Use each environment's package manager or developer tools to obtain GNU Make; do not install a private make-proj fallback. Android support for Docker Compose and every pinned tool is not assumed.
    source: user
  - id: P-0013
    statement: Optional personal AI tooling remains documented and is never required by checks, bootstrap or handoffs; pin it before sharing. Host developer tools are checked for presence only, without version pins or mise. Setup reports missing tools and offers installation, but agents install only after explicit owner approval; diagnostic checks and bootstrap never install tools.
    source: user
  - id: P-0014
    statement: Agents run `make doctor` only when the owner explicitly asks to check developer-tool availability.
    source: user
    rationale: Avoid unrelated sessions triggering tool checks and reporting setup issues the owner did not ask about.
    enforced_by: [AGENTS.md, docs/agents/orchestrator.md]
    planned_enforced_by: [openspec/specs/agent-roles/spec.md]
  - id: P-0015
    statement: "Work runs in lanes chosen by the orchestrator. S (fix, refactor, docs or tests with no observable behavior change): implementer, then make check; no OpenSpec. M (feature inside an existing service, no new decision): light OpenSpec change (proposal, delta spec, tasks), owner approves, implementer writes code, tests and docs, reviewer also verifies docs. L (new service or deployable, decision, infra, contract break, destructive migration, or any security trigger): the full flow. When in doubt, take the higher lane. Archiving needs no owner approval."
    source: user
    rationale: Most work is small; running every change through 9 roles and 3 owner gates costs tokens and makes the owner the bottleneck. Risky work keeps every gate.
    enforced_by: [AGENTS.md, docs/agents/orchestrator.md, docs/agents/README.md, docs/agents/reviewer.md, openspec/specs/agent-roles/spec.md]
  - id: P-0016
    statement: This repository is a reusable base for new products. The generic harness (way of working, runtime contract, validation, roles) is the core. Product-specific choices (B2C, user roles, identity provider, slug, initial deployables) are defaults that each new product confirms or replaces in its first session.
    source: user
    rationale: The owner bootstraps several products from this base; product choices recorded as accepted decisions would force a decision change in every new product.
    enforced_by: [docs/standards/new-product.md, docs/decisions/registry.yaml, docs/agents/orchestrator.md, AGENTS.md]
  - id: P-0017
    statement: The model used by each agent role is personal OpenCode configuration (agents.<role>.model in the user config), never committed to the repository. Current owner setup is Claude Haiku 5.5 (high) for every role.
    source: user
    rationale: Model IDs depend on the provider; committed models would break for other providers and future products.
    enforced_by: [docs/standards/agent-tooling.md]
  - id: P-0018
    statement: Deploys pin SSH host keys. The deploy workflow reads the target's known_hosts lines from the GitHub Environment variable DEPLOY_KNOWN_HOSTS and uses StrictHostKeyChecking=yes; a deploy without it fails instead of trusting a key on first use.
    source: user
    rationale: Ephemeral CI runners would otherwise trust whatever key the first connection presents (security review of ci-cd-template).
    planned_enforced_by: [infra/deploy/deploy.sh, .github/workflows/_deploy.yml, infra/README.md]

assumptions:
  - id: A1
    statement: Project slug "har" (image names har-<name>, proto packages har.<domain>); each product may rename it (docs/standards/new-product.md). Domains are config (DOMAIN).
  - id: A2
    statement: Seconds of downtime per deploy is acceptable in dev and prod initially.

open_questions:
  # Deferred choices (P-0016). needed_by is the trigger: before work that reaches it, the orchestrator stops
  # and asks the owner (docs/standards/new-product.md). The answer becomes a decision; the question moves to history.
  - id: Q6
    question: What is the product (domain, users and roles, tenancy, B2B/B2C)?
    needed_by: before any product feature, service or frontend
  - id: Q3
    question: Email provider and public domain.
    needed_by: before the first dev deploy that sends email or needs TLS
  - id: Q4
    question: Launch country (decides GDPR applicability).
    needed_by: before prod
  - id: Q7
    question: Asynchronous messaging (none, Redis pub/sub, Redis Streams, a broker); depends on whether losing an event is acceptable.
    needed_by: the first event published from one service to another
  - id: Q8
    question: How browsers and third parties call APIs (REST transcoding, Connect JSON client, other).
    needed_by: the first public API
  - id: Q9
    question: Hosting and infrastructure as code (cloud provider, OpenTofu module shape, managed Postgres, backups).
    needed_by: the first deploy to a real dev host
  - id: Q10
    question: Identity (login methods, identity provider or library, staff accounts and 2FA).
    needed_by: the first feature that needs a signed-in user
  - id: Q11
    question: Frontend framework and rendering mode (SPA, server-rendered, static); depends on SEO needs.
    needed_by: the first frontend
