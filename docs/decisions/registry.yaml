# Decision & preference registry: CURRENT project memory. Read this at session start.
# Superseded entries, resolved questions and the changelog live in history.yaml (not read at session start;
# the harness merges both files, R-REG-006).
# - status: proposed | accepted | superseded | deprecated
# - source: user (stated/approved by owner) | default (agent proposal, not contested)
# - enforced_by: files that enforce the entry TODAY (validated by R-REG-004)
# - planned_enforced_by: enforcement that arrives with later changes (not validated)
# - a decision with `scope` (services/* or apps/*) and `default_language` overrides the built-in language default
#   (go for services, typescript for apps) and may list `exceptions` (path, language, reason) (R-CAT-002).
# The template starts with no decisions: its starting rules live in ARCHITECTURE.md, docs/standards/ and AGENTS.md.
# The product's decisions start at D-0001 and preferences at P-0001.
# Change accepted entries only through an OpenSpec change (see CONTRIBUTING.md).

version: 1

decisions: []

preferences: []

assumptions: []

open_questions:
  # Product choices. needed_by is the trigger: before work that reaches it, the orchestrator stops and asks the
  # owner (docs/standards/new-product.md). The answer becomes a decision; the question moves to history.
  - id: Q1
    question: What is the product (domain, users and roles, tenancy, B2B/B2C)?
    needed_by: before any product feature, service or frontend
  - id: Q2
    question: Email provider and public domain.
    needed_by: before the first dev deploy that sends email or needs TLS
  - id: Q3
    question: Launch country (decides GDPR applicability).
    needed_by: before prod
  - id: Q4
    question: "Asynchronous messaging (none, Redis pub/sub or Streams, a broker, an outbox); depends on whether losing an event is acceptable."
    needed_by: the first event published from one service to another
  - id: Q5
    question: "How browsers and third parties call APIs (REST transcoding with OpenAPI, Connect JSON client, a BFF, other)."
    needed_by: the first public API
  - id: Q6
    question: "Hosting and infrastructure as code (cloud provider, IaC tool and module shape, managed or self-run Postgres, backups)."
    needed_by: the first deploy to a real dev host
  - id: Q7
    question: "Identity (login methods, identity provider or library, staff accounts and 2FA)."
    needed_by: the first feature that needs a signed-in user
  - id: Q8
    question: Frontend framework and rendering mode (SPA, server-rendered, static); depends on SEO needs.
    needed_by: the first frontend
