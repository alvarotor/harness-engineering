# Decision & preference registry: machine-readable project memory (ADR-0001).
# Every durable decision, preference, constraint or convention gets an entry.
# - status: proposed | accepted | superseded | deprecated
# - source: user (stated/approved by owner) | default (agent proposal, not contested)
# - enforced_by: files that enforce the entry TODAY (validated by tools/harness rule R-REG-004)
# - planned_enforced_by: enforcement that arrives with later changes (not validated)
# - superseded_by: required when status is superseded
# Change accepted entries only through an OpenSpec change (see CONTRIBUTING.md).

version: 1

decisions:
  - id: D-0001
    title: Repository is project memory; instruction precedence; controlled decision changes
    status: accepted
    source: user
    adr: docs/adr/0001-repository-as-project-memory.md
    enforced_by: [AGENTS.md, CONTRIBUTING.md, openspec/config.yaml, docs/agents, tools/harness]

  - id: D-0002
    title: Monorepo; deployables never import each other; infra/ holds all env and deploy material; Makefile is the single entry point
    status: accepted
    source: default
    adr: docs/adr/0002-monorepo-topology.md
    enforced_by: [AGENTS.md, CONTRIBUTING.md, Makefile, tools/harness]
    planned_enforced_by: ["tools/harness: cross-deployable import rule"]

  - id: D-0003
    title: All deployables are containers; Compose for local/dev/prod; Kubernetes-ready rules; build once, promote by digest
    status: accepted
    source: user
    adr: docs/adr/0003-containers-compose-k8s-ready.md
    enforced_by: [docs/standards/engineering.md, infra/AGENTS.md]
    planned_enforced_by: [infra/compose, templates, "tools/harness: compose rules"]

  - id: D-0004
    title: Go is the default backend language (hexagonal-lite); another language only when its core dependency requires it
    status: accepted
    source: user
    adr: docs/adr/0004-go-hexagonal-lite-backends.md
    scope: services/*
    default_language: go
    exceptions:
      - path: services/auth
        language: typescript
        reason: Better Auth is TypeScript-only
    enforced_by: [services/AGENTS.md, docs/standards/engineering.md, tools/harness]
    planned_enforced_by: [templates/go-service, templates/node-service, "tools/harness: layer import rule"]

  - id: D-0005
    title: Identity is services/auth (Better Auth, Node 24 + Hono); email magic link only; staff invite-only; JWT/JWKS verified locally
    status: accepted
    source: user
    adr: docs/adr/0005-identity-better-auth.md
    enforced_by: [docs/standards/security.md, docs/catalog/services.yaml]
    planned_enforced_by: [services/auth]

  - id: D-0006
    title: Frontends are Preact + Vite + TS SPAs in static non-root nginx containers with runtime config
    status: accepted
    source: user
    adr: docs/adr/0006-frontends-preact-vite-spa.md
    scope: apps/*
    default_language: typescript
    enforced_by: [apps/AGENTS.md, docs/standards/engineering.md, tools/harness]
    planned_enforced_by: [templates/ts-spa]

  - id: D-0007
    title: Protobuf contracts (buf); gRPC for synchronous service-to-service calls; REST edge via Vanguard transcoding; OpenAPI generated
    status: accepted
    source: user
    adr: docs/adr/0007-contracts-proto-connect-rest.md
    enforced_by: [contracts/AGENTS.md, docs/standards/engineering.md]
    planned_enforced_by: [contracts/proto/buf.yaml, .github/workflows]

  - id: D-0008
    title: One Postgres server per env with one database per service; owner/app roles; explicit expand/contract migrations; backups deferred
    status: accepted
    source: user
    adr: docs/adr/0008-postgres-db-per-service.md
    enforced_by: [services/AGENTS.md, docs/standards/engineering.md]
    planned_enforced_by: [infra/postgres, templates]

  - id: D-0009
    title: Traefik is the only exposed container; routes via Compose labels; Docker API only via read-only socket proxy; subdomains; ops port 8081 never routed
    status: accepted
    source: user
    adr: docs/adr/0009-edge-and-network.md
    enforced_by: [infra/AGENTS.md, docs/standards/security.md]
