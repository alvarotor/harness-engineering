preferences:
  - id: P-0001
    statement: Product is B2C. Roles are customer, support, admin. Single tenant.
    source: user
  - id: P-0002
    statement: Start simple and reversible. Introduce gateway, durable broker, mesh, Kubernetes or cache only on the triggers in ARCHITECTURE.md §13.
    source: user
  - id: P-0003
    statement: Never silently make expensive, security-sensitive or hard-to-reverse decisions. Ask the owner.
    source: user
  - id: P-0004
    statement: Never claim validation passed unless it was executed.
    source: user
  - id: P-0005
    statement: Current stage defines the way of working (harness) and a first basic architecture. No product features yet.
    source: user
  - id: P-0006
    statement: Language/framework choices are defaults; a specific library choice (e.g. Better Auth) may justify an override, recorded as an exception.
    source: user
  - id: P-0007
    statement: Agents may install developer tools locally (user space) only after explicit owner approval. If an install needs privileges (sudo), give the owner the exact commands instead.
    source: user
  - id: P-0008
    statement: "Agent roles are: orchestrator (sequences work, never edits), architect, planner (also archives), implementer, test-engineer, security-reviewer (only for security-sensitive changes), reviewer, documentation, devops."
    source: user
  - id: P-0009
    statement: Supported developer OSes are macOS and Linux only (never Windows). The OS-provided GNU-compatible make is used; no custom task runner. make is a documented prerequisite because minimal Linux images and macOS without developer tools may lack it. Without sudo, a user-space copy is installed as make-proj, never as make.
    source: user
    status: superseded
    superseded_by: P-0012
  - id: P-0011
    statement: Optional personal AI tooling (codebase graph, MCP servers, search, caveman) is documented in docs/standards/agent-tooling.md and is never required by checks, bootstrap or handoffs. Unpinned tools must be pinned before sharing. Project tools stay in .tool-versions and package.json.
    source: user
    status: superseded
    superseded_by: P-0013
  - id: P-0012
    statement: Supported developer environments are macOS, Linux and Termux for GNU Make and repository commands whose host dependencies are available. Use each environment's package manager or developer tools to obtain GNU Make; do not install a private make-proj fallback. Android support for Docker Compose and every pinned tool is not assumed.
    source: user
  - id: P-0013
    statement: Optional personal AI tooling remains documented and is never required by checks, bootstrap or handoffs; pin it before sharing. Host developer tools are checked for presence only, without version pins or mise. Setup reports missing tools and offers installation, but agents install only after explicit owner approval; diagnostic checks and bootstrap never install tools.
    source: user
  - id: P-0014
    statement: Agents run `make doctor` only when the owner explicitly asks to check developer-tool availability.
    source: user
    rationale: Avoid unrelated sessions triggering tool checks and reporting setup issues the owner did not ask about.
    enforced_by: [AGENTS.md, docs/agents/orchestrator.md]
    planned_enforced_by: [openspec/specs/agent-roles/spec.md]
  - id: P-0010
    statement: Every role documents its own work in the same step, following the documentation map in docs/agents/README.md. The documentation role only verifies this against the change and fixes descriptive gaps, reporting who missed them.
    source: user

assumptions:
  - id: A1
    statement: Project slug "har"; domains are config (DOMAIN).
  - id: A2
    statement: Seconds of downtime per deploy is acceptable in dev and prod initially.
  - id: A3
    statement: Staff accounts (support, admin) are invite-only, created by admins.
  - id: A4
    statement: Initial deployables are apps/web, apps/admin, services/auth, services/core.
  - id: A5
    statement: services/core hosts the first business domain and is renamed once that domain is named.

open_questions:
  - id: Q3
    question: Email provider and public domain.
    needed_by: before-dev-deploy
  - id: Q4
    question: Launch country (decides GDPR applicability).
    needed_by: before-prod

resolved_questions:
  - id: Q1
    question: GitHub owner for repo and GHCR.
    resolution: No repo yet; workflows use github.repository_owner, so nothing is hard-coded.
  - id: Q2
    question: Prod Postgres backups / managed.
    resolution: No backups yet (owner). Postgres runs as a container on the env VM. Backups are mandatory before real user data reaches prod.
  - id: Q5
    question: Does the OpenAPI generator support google.api.http annotations?
    resolution: Yes (owner confirmed).

# Corrections log: what changed and why, so future sessions don't reintroduce old choices.
changelog:
  - date: 2026-10-15
    changes:
      - "Edge proxy: Caddy -> Traefik (owner)."
      - "Traefik routing via Docker labels + read-only socket proxy (owner, over file-provider recommendation)."
      - "Async: none/outbox-first -> Redis pub/sub (owner, over RabbitMQ/Streams recommendation; at-most-once accepted)."
      - "Go reframed as the default backend language with an override rule; services/auth in Node is the first exception."
      - "Postgres: explicitly one server per env with a database per service; backups deferred."
      - "Infra: OpenTofu, provider-neutral capability modules, AWS default."
      - "Testing: >= 80% coverage, unit tests for all code, e2e when possible."
      - "Service granularity: one service per business domain."
      - "Auth: passkeys removed; email magic link only for all roles."
      - "GDPR: out of scope -> undetermined (launch country unknown)."
  - date: 2026-10-15
    changes:
      - "Owner approved Phase 2: D-0001..D-0017 accepted (OpenSpec change bootstrap-dev-harness)."
      - "Tooling installed in user space: OpenTofu 1.13.1, buf 1.74.0, golangci-lint 2.14.0, Playwright 1.64.1 (P-0007)."
      - "GNU make 4.4.1 was missing; extracted from the apt package into ~/.local/bin without sudo. Owner may replace it with: sudo apt-get install -y make."
      - "Harness (bootstrap-dev-harness) implemented: 17 rules, make check passing."
  - date: 2026-10-15
    changes:
      - "Roles 6 -> 9 (owner): added orchestrator and documentation; security review split out of reviewer into security-reviewer (P-0008)."
      - "GNU Make documented as a prerequisite (P-0009)."
  - date: 2026-10-15
    changes:
      - "Documentation role narrowed (owner): it verifies each role documented its own work and fixes gaps; it no longer owns system-wide docs or archiving (P-0010). Archiving moved to the planner."
      - "Reviewer no longer checks docs; documentation role does."
      - "Supported OSes: macOS and Linux only; use the OS make, no custom runner (P-0009). Windows install row removed."
      - "User-space make copy removed from ~/.local/bin/make (it was being mistaken for the OS make) and reinstalled as ~/.local/bin/make-proj (owner). A user-space copy must never be named make."
  - date: 2026-10-15
    changes:
      - "Added scripts/bootstrap.sh with mise (D-0018, owner). Ran on this machine: mise 2026.10.11 and all 6 pinned tools installed under ~/.local/share/mise; make doctor ok."
  - date: 2026-10-16
    changes:
      - "Optional personal AI tooling documented in docs/standards/agent-tooling.md, never required by checks (P-0011)."
  - date: 2026-11-05
    changes:
      - "D-0019 supersedes D-0018 for agent behavior: propose bootstrap after doctor failure, summarize its actions, and wait for owner approval before running it."
  - date: 2026-11-09
    changes:
      - "D-0020 supersedes D-0019: supports Termux with package-manager GNU Make and no make-proj fallback, while preserving the agent bootstrap approval gate; P-0012 supersedes P-0009."
      - "D-0021 supersedes D-0020: developer tools are presence-checked without mise, host-tool version pins, or automatic installation; P-0013 supersedes P-0011 and P-0007 now requires explicit approval for local installation."
  - date: 2026-11-11
    changes:
      - "P-0014: run `make doctor` only when the owner explicitly requests a developer-tool check."
