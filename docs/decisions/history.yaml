preferences:
  - id: P-0019
    statement: make doctor also reports the GitHub delivery setup when the repository has a GitHub remote and the gh CLI is authenticated - environments dev and prod, required reviewers on prod, the deploy variables and secrets by name, and branch protection on main. It only reports; it never changes GitHub settings, and it skips with a note when there is no remote or gh.
    source: user
    status: deprecated
    rationale: The owner configures GitHub by hand; doctor detects what is missing instead of relying on memory.
    planned_enforced_by: [scripts/github-check.sh, Makefile, CONTRIBUTING.md, infra/README.md]
  - id: P-0001
    statement: Product is B2C. Roles are customer, support, admin. Single tenant.
    source: user
    status: deprecated
  - id: P-0009
    statement: Supported developer OSes are macOS and Linux only (never Windows). The OS-provided GNU-compatible make is used; no custom task runner. make is a documented prerequisite because minimal Linux images and macOS without developer tools may lack it. Without sudo, a user-space copy is installed as make-proj, never as make.
    source: user
    status: superseded
    superseded_by: P-0012
  - id: P-0011
    statement: Optional personal AI tooling (codebase graph, MCP servers, search, caveman) is documented in docs/standards/agent-tooling.md and is never required by checks, bootstrap or handoffs. Unpinned tools must be pinned before sharing. Project tools stay in .tool-versions and package.json.
    source: user
    status: superseded
    superseded_by: P-0013

resolved_questions:
  - id: Q1
    question: GitHub owner for repo and GHCR.
    resolution: No repo yet; workflows use github.repository_owner, so nothing is hard-coded.
  - id: Q2
    question: Prod Postgres backups / managed.
    resolution: No backups yet (owner). Postgres runs as a container on the env VM. Backups are mandatory before real user data reaches prod.
  - id: Q5
    question: Does the OpenAPI generator support google.api.http annotations?
    resolution: Yes (owner confirmed).

