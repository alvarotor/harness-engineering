# Lint, test and build the image of one deployable (services/<name> or apps/<name>), then scan the image (M6).
# Used by pull requests. Publishing to GHCR is in _publish.yml (its own ceiling, packages: write).
name: deployable

on:
  workflow_call:
    inputs:
      path:
        description: Deployable folder, for example services/orders
        required: true
        type: string

# Top level grants nothing; the job below sets the ceiling. A called job can only reduce its caller's grant.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: hashFiles(format('{0}/go.mod', inputs.path)) != ''
        with:
          go-version-file: ${{ inputs.path }}/go.mod
      - name: Install golangci-lint
        if: hashFiles(format('{0}/go.mod', inputs.path)) != ''
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint, test and build the image
        env:
          DEPLOYABLE: ${{ inputs.path }}
        run: |
          set -eu
          make -C "$DEPLOYABLE" lint test image
      - name: Scan the image (HIGH and CRITICAL with a fix)
        env:
          DEPLOYABLE: ${{ inputs.path }}
        run: |
          set -eu
          name=${DEPLOYABLE##*/}
          make image-scan IMAGE="har-$name:local"
